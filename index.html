<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkup Social | Logged Out</title>
    <link rel="stylesheet" href="style001.css">
    <link rel="icon" type="image/png" href="CDN/LinkupSocialIco.png">
</head>

<body>

    <header id="header">
        <h1>Linkup</h1>
    </header>

    <nav id="nav">
        <a href="Authentication/Signup/" class="nav_btn loggedInHide">Sign Up</a>
        <a href="Authentication/Signin/" class="nav_btn loggedInHide">Sign In</a>
        <a href="Authentication/Account/"
           class="nav_btn loggedInShow"
           id="accountSettings"
           style="display: none;">
            Account Settings
        </a>
        <a href="#" class="nav_btn loggedInShow" id="logoutBtn" onclick="logout()" style="display: none;">Log Out</a>
    </nav>

    <main id="content">

        <!-- JavaScript can create posts here -->

        <article class="post" id="0000-0000-0000-0000">
            <div class="post_header">
                <span class="post_user">Please Wait...</span>
                <span class="post_date">Not Loaded</span>
            </div>

            <div class="post_content">
                Wait For The Posts To Load, If There Are Errors Check Your Network Connections Or Email
            </div>
        </article>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="home.js"></script>

</body>
</html>
