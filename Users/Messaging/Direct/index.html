<!DOCTYPE html>
<html lang="en-us" theme="dark">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
          
    <meta name="description"
          content="Connect with people and share posts on SupaSocial.">

    <!-- Discord / Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SupaSocial">
    <meta property="og:description"
          content="Connect with people and share posts on SupaSocial.">
    <meta property="og:url"
          content="https://linkupsocial-contracts.github.io/WebVer/">
    <meta property="og:image"
          content="https://linkupsocial-contracts.github.io/WebVer/CDN/Supabase64.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SupaSocial">
    <meta name="twitter:description"
          content="Connect with people and share posts on SupaSocial.">
    <meta name="twitter:image"
          content="https://linkupsocial-contracts.github.io/WebVer/CDN/Supabase64.png">

    <title>SupaSocial | NO ACCESS</title>

    <link rel="stylesheet"
          href="../../../style_0FA1.css">
    <link rel="stylesheet" href="styles_0FA9.css">
    <style>
        .bad_btn
        {
            border-color: black;
            border-style: solid;
            border-width: 1px;
            border-radius: 1px;
            background-color: red;
            color: white;
            font-weight: bold;
            width: 150px;
        }
        #Headblock 
        {
            width: 750px;
        }
        .bad_btn:hover
        {
            background-color: rgb(250,0,0);
        }
        .DMListHide
        {
            background-color: white;
            margin: 0;
            min-height: 100vh;       /* Ensures the page takes up the full screen height */
            display: flex;
            justify-content: center; /* Horizontally centers content */
            align-items: center;     /* Vertically centers content */
        }
        .DMListXCard
        {
            background-color: red;
            color: white;
            border-radius: 40px;
            height: 50%;
            margin: 10px;
            padding: 20px;
            text-align: center;
            align-content: center;
        }
        @media screen and (max-width: 750px) {
    .DMListXCard {
        width: 100%;
    }

    #sidebar {
        display: none;
    }
}
    </style>
</head>


<body>

    <!-- ==========================================
         MAIN SIDEBAR
    =========================================== -->

    <aside id="sidebar">

        <div class="sidebar_brand">

            <div class="brand_icon">
                <img
                    src="../../../CDN/Supabase64.png"
                    width="24"
                >
            </div>

            <span>SupaSocial</span>

        </div>


        <div class="sidebar_section">

            <span class="sidebar_title">
                SUPASOCIAL
            </span>

            <a href="../../../"
               class="sidebar_btn">

                <span class="sidebar_icon">
                    <img src="../../../CDN/Home64.png" width="24">
                </span>

                Home

            </a>


            <a href="?isfriend=false"
               class="sidebar_btn active">

                <span class="sidebar_icon ">
                    <img src="../../../CDN/Friend64.png" width="24">
                </span>

                Friends

            </a>


            <a href="#"
               class="sidebar_btn">

                <span class="sidebar_icon">
                    <img src="../../../CDN/Bell64.png" width="24">
                </span>

                Notifications

            </a>
            <a href="../../../Help/Whats-New/" class="sidebar_btn
            ">

                <span class="sidebar_icon">
                    <img src="../../../CDN/New64.png" width="24">
                </span>
                Whats New
            </a>

        </div>


        <div class="sidebar_section">

            <span class="sidebar_title">
                ACCOUNT
            </span>


            <a href="../../../Auth/Signup/"
               class="sidebar_btn loggedInHide">

                <span class="sidebar_icon">
                    ＋
                </span>

                Sign Up

            </a>


            <a href="../../../Auth/Signin/"
               class="sidebar_btn loggedInHide">

                <span class="sidebar_icon">
                    →
                </span>

                Sign In

            </a>


            <a href="../Account/"
               class="sidebar_btn loggedInShow"
               id="accountSettings"
               style="display:none;">

                <span class="sidebar_icon">
                    ⚙
                </span>

                Account Settings

            </a>


            <a href="#"
               class="sidebar_btn loggedInShow"
               id="logoutBtn"
               onclick="logout()"
               style="display:none;">

                <span class="sidebar_icon">
                    ↪
                </span>

                Log Out

            </a>

        </div>


        <!-- USER -->

        <div class="sidebar_user">

            <div class="user_avatar">

                <img
                    src="../../../CDN/User64.png"
                    width="32"
                >

            </div>


            <div class="user_info">

                <strong id="sidebarUsername">
                    SupaSocial User
                </strong>

                <span id="sidebarStatus">
                    Logged Out
                </span>

            </div>

        </div>

    </aside>



   
    <div class="app loggedInHide DMListHide">
        <div class="DMListXCard">
            <h1>You Do Not Have Access To This Page</h1>
            <p style="font-weight: bolder;">Please Login To Gain Access</p>
            <button class="bad_btn" onclick="window.location.href = '../../../Auth/Signin/'">Login</button>
            <button class="bad_btn" onclick="window.location.href = '../../../'">Home</button>
        </div>
        
    </div>
    <div class="app loggedInShow" style="display: none;">


        <!-- ======================================
             DM LIST
        ======================================= -->

        <div id="dm-list">

            <div class="dm-list-header">

                <strong>
                    Direct Messages
                </strong>

            </div>

            <button
                class="dm-item"
                data-user-id="null"
            >

                <div class="dm-avatar">

                    <img
                        src="../../../CDN/Supabase64.png"
                        width="40"
                    >

                </div>


                <div class="dm-info">

                    <strong>
                        Loading..
                    </strong>

                    <span>
                        No Information
                    </span>

                </div>

            </button>

        </div>



        <!-- ======================================
             CONTENT OF SELECTED DM
        ======================================= -->

        <div id="dm-content">


            <!-- HEADER -->

            <header id="header">

                <div class="channel_title">

                    <span class="channel_hash">
                        @
                    </span>

                    <h1 id="dmUsername">
                        No User Selected
                    </h1>

                </div>


                <div class="header_actions">

                    <button
                        type="button"
                        title="Notifications"
                    >
                        <img src="../../../CDN/Bell64.png" width="24">
                    </button>


                    <button
                        type="button"
                        title="Help"
                    >
                        ?
                    </button>

                </div>

            </header>



            <!-- ==================================
                 MESSAGES
            =================================== -->

            <main id="content">
                <h3 style="align-items: center; align-self: center; align-content: center;">Select A User</h3>
            </main>



            <!-- ==================================
                 MESSAGE INPUT
            =================================== -->

            <div id="message_bar">

                <button
                    class="message_add"
                    type="button"
                >
                    ＋
                </button>


                <input
                    type="text"
                    id="messageInput"
                    placeholder="No User To Message Yet"
                    autocomplete="off"
                    maxlength="2000"
                >


                <button
    class="message_button"
    id="sendMessageButton"
    type="button"
    title="Send"
>
    <img
        src="../../../CDN/SendIco.png"
        width="26"
    >
</button>

            </div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="Scripts_0FA9.js"></script>

</body>

</html>
