
<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Linkup Social | Sign In</title>

    <link rel="icon"
          type="image/png"
          href="../../CDN/Supabase64.png">

    <link rel="stylesheet"
          href="signin.css">
</head>

<body>

    <div class="page">

        <div class="login_card">

            <!-- Logo -->
            <div class="logo">
                <img src="../../CDN/Supabase64.png"
            </div>


            <!-- Heading -->
            <h1>Welcome back!</h1>

            <p class="subtitle">
                We're so excited to see you again!
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <div class="form_group">

                    <label for="email">
                        EMAIL
                        <span>*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form_group">

                    <label for="password">
                        PASSWORD
                        <span>*</span>
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="forgot">
                    <a href="../ForgotPassword/">
                        Forgot your password?
                    </a>
                </div>


                <div
                    id="loginError"
                    class="login_error">
                </div>


                <button
                    type="submit"
                    id="loginButton">
                    Log In
                </button>


                <p class="register">

                    Need an account?

                    <a href="../Signup/">
                        Register
                    </a>
                     Guest Mode? <a href="../../">View</a>
                </p>
                

            </form>

        </div>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Linkup authentication -->
    <script src="signin.js"></script>

</body>

</html>
